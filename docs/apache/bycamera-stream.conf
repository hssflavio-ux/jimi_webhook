# ============================================================
# bycamera — stream HTTP-FLV pela MESMA ORIGEM (HTTPS)
# ============================================================
# 🔴 POR QUE ISTO EXISTE. O player (`flv.js`) busca o stream por XHR. Com o
# painel em `https://bycamera.ia.br` e o media server em
# `http://IP:8881`, o navegador BLOQUEIA a requisição como *mixed content* —
# do lado do cliente, sem tocar no servidor. Sintoma: o vídeo não abre, o
# comando `37121` responde `ok`, a câmera publica normalmente e não há UMA
# LINHA de erro em log nenhum. Foi o que aconteceu ao ligar o TLS em 13/08.
#
# Medido antes da correção: `curl http://127.0.0.1:8881/1/<imei>.flv` devolveu
# **637 KB** com assinatura `FLV` logo após o 37121. O caminho de mídia estava
# íntegro; só o navegador recusava.
#
# Fica em `conf-available` (e não no vhost) de propósito: o vhost TLS é gerado
# e reescrito pelo certbot a cada renovação, e diretiva posta lá pode ser
# perdida sem aviso.
<IfModule mod_proxy_http.c>
    ProxyRequests Off

    # ⚠️ `flushpackets=on` NÃO é ajuste fino, é o que faz funcionar: o FLV ao
    # vivo é uma resposta que nunca termina. Sem isso o Apache segura os dados
    # no buffer esperando o fim, e o player fica eternamente "conectando".
    #
    # `retry=0` para o Apache não marcar o backend como morto por 60 s quando
    # o stream ainda não começou — a tela tenta 8 vezes a cada 3 s, e sem isto
    # as tentativas seguintes nem chegariam ao media server.
    ProxyPass        /stream/ http://127.0.0.1:8881/ flushpackets=on retry=0 timeout=120
    ProxyPassReverse /stream/ http://127.0.0.1:8881/

    # O media server é interno; não repassar o Host externo evita que ele
    # monte URLs com o domínio público em respostas de erro.
    ProxyPreserveHost Off
</IfModule>

# ── Corpo "chunked" da câmera JIMI (v4.9.18) ────────────────────────────────
# 🔴 A câmera envia o FILELIST com `Transfer-Encoding: chunked` e SEM
# Content-Length. Nessa condição o mod_proxy_fcgi entrega ao PHP um corpo
# VAZIO — a requisição chega, responde 200, e `php://input` vem com 0 bytes.
# Medido em 14/08/2026: dois uploads reais da câmera, ambos com corpo_bytes=0.
#
# `proxy-sendcl` manda o Apache bufferizar a requisição e calcular o
# Content-Length antes de repassar ao backend. Sem isto o endpoint parece
# funcionar e não recebe nada — o pior tipo de falha.
<Location /filelist/>
    SetEnv proxy-sendcl 1
</Location>
