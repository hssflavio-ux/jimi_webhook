# ============================================================
# bycamera — VirtualHost de produção
# ============================================================
# O front controller é o .htaccess da raiz, que reescreve toda requisição
# que NÃO seja arquivo/diretório real para handlers/router.php. Por isso
# AllowOverride All é obrigatório: sem ele o .htaccess é ignorado e todas as
# rotas (/dashboard, /pushgps, ...) devolvem 404.
#
# É também o que faz valer storage/reports/.htaccess (Require all denied), a
# diretiva que dá sentido à assinatura HMAC do /download — com o caminho
# direto aberto, o link antigo continuaria eterno.
<VirtualHost *:80>
    ServerName www.bycamera.ia.br
    # 🔴 `iothub.bycamera.ia.br` é o nome que fica GRAVADO nas câmeras (v4.17.9).
    # Sem ele nesta lista, um POST com `Host: iothub.…` não casa com nenhum
    # ServerName e cai no vhost DEFAULT do Apache — que, se `000-default.conf`
    # estiver habilitado, serve `/var/www/html` e devolve 404 para `/filelist/`.
    # Falha silenciosa: a câmera manda a lista, recebe 404, e do nosso lado o
    # sintoma é só "nenhuma gravação aparece" — o mesmo sintoma do corpo chunked
    # descartado (docs/apache/filelist-chunked.conf), que custou cinco dias.
    ServerAlias bycamera.ia.br iothub.bycamera.ia.br 186.248.143.197
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/jimi_webhook

    <Directory /var/www/jimi_webhook>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ── Código e dados internos: nunca pela web ──────────────────────────
    # O .htaccess raiz só reescreve o que não existe em disco (`!-f`), então
    # todo arquivo REAL é servido estaticamente. Sem as negações abaixo,
    # /logs/webhook_AAAA-MM-DD.log e /mysql/jimi_tracker.sql seriam públicos.
    #
    # `scripts/` é o mais grave: são os workers de cron. Aberto, qualquer um
    # dispararia worker.php pela web — envio duplicado de e-mail e carga.
    <DirectoryMatch "^/var/www/jimi_webhook/(config|core|includes|scripts|mysql|tests|docs|archive|analise_yuv|logs|\.git|\.agents|\.hallmark|\.remember|\.githooks)(/|$)">
        Require all denied
    </DirectoryMatch>

    # ── Arquivos sensíveis avulsos ───────────────────────────────────────
    # .env leva as credenciais do banco e a APP_KEY. A config padrão do
    # Ubuntu só nega ".ht*", então .env seria entregue em texto puro.
    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>
    # server.php é o shim do servidor embutido (dev); .md são a documentação
    # interna do produto; os .json/.js abaixo são de build/teste.
    # manifest.json fica DE FORA da lista de propósito — o PWA precisa dele.
    <FilesMatch "^(server\.php|package\.json|package-lock\.json|skills-lock\.json|playwright\.config\.js|llms\.txt|LICENSE|.*\.md)$">
        Require all denied
    </FilesMatch>

    # Compressão dos textos (o CSS é inline no layout, mas o HTML é grande).
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/bycamera_error.log
    CustomLog ${APACHE_LOG_DIR}/bycamera_access.log combined
RewriteEngine on
# ⚠️ `iothub.…` PRECISA entrar aqui junto com o ServerAlias. O cookie de sessão
# leva `secure` derivado do próprio request (includes/auth.php): servido em HTTP
# puro, o `jimi_token` viaja em claro. Só que redirecionar para HTTPS num nome
# fora do certificado dá aviso de certificado no navegador — então, ao publicar
# o nome, expanda o certificado junto:
#   sudo certbot --apache --expand -d bycamera.ia.br -d www.bycamera.ia.br \
#        -d iothub.bycamera.ia.br
# A câmera não é afetada por nada disso: ela só fala HTTP e só em `/filelist/`,
# que a linha de exceção abaixo mantém fora do redirect.
RewriteCond %{SERVER_NAME} =186.248.143.197 [OR]
RewriteCond %{SERVER_NAME} =bycamera.ia.br [OR]
RewriteCond %{SERVER_NAME} =iothub.bycamera.ia.br [OR]
RewriteCond %{SERVER_NAME} =www.bycamera.ia.br
# v4.9.18 — a camera JIMI fala HTTP simples e nao segue redirect: sem esta
# excecao o FILELIST receberia 301 e o upload morreria sem rastro do nosso lado.
RewriteCond %{THE_REQUEST} !\s/filelist/
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
