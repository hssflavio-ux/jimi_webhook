# ============================================================================
# bycamera — o corpo do /filelist precisa chegar inteiro ao PHP
#
# Instalar em: /etc/apache2/conf-available/filelist-chunked.conf
# Ativar com:  sudo a2enconf filelist-chunked
#              sudo apache2ctl configtest && sudo systemctl reload apache2
# Reverter:    sudo a2disconf filelist-chunked && sudo systemctl reload apache2
#
# ── O QUE ISTO CORRIGE ──────────────────────────────────────────────────────
#
# A câmera JIMI sobe a lista de gravações do cartão com `Transfer-Encoding:
# chunked` e SEM `Content-Length`. O PHP é servido por mod_proxy_fcgi
# (`SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"`), e nesse
# caminho o corpo chunked é DESCARTADO EM SILÊNCIO acima de 16 KB: HTTP 200
# normal, nada no error.log, e `php://input` vazio.
#
# Medido por busca binária no próprio servidor (19/08/2026):
#
#     13.043 B → chegam 13.043  ✓        16.699 B → chegam 0  🔴
#     16.293 B → chegam 16.293  ✓        39.043 B → chegam 0  🔴
#
# Fronteira cravada em 16.384 (16 K) — número de buffer, não de protocolo.
# `post_max_size` é 8M e não há `LimitRequestBody`; nenhum dos dois explica.
#
# A culpa foi ISOLADA por experimento: o MESMO corpo de 39.030 bytes, pelo mesmo
# socket cru, chega inteiro ao servidor embutido do PHP (`php -S`, sem Apache) e
# chega ZERADO passando por Apache → mod_proxy_fcgi → PHP-FPM.
#
# A lista real de uma JC400AD tem ~3.000 nomes (78 KB) e passa MUITO dos 16 K,
# então caía sempre — é por isso que o FILELIST nunca produziu nada.
#
# ── POR QUE `proxy-sendcl` ──────────────────────────────────────────────────
#
# Ele manda o proxy spoolar o corpo e entregá-lo ao backend com
# `Content-Length` — que é exatamente o que falta. Verificado que o módulo o
# conhece: `grep -a 'proxy-sendcl' /usr/lib/apache2/modules/mod_proxy_fcgi.so`
# casa, ao lado de `proxy-fcgi-input` e `proxy-nocanon`.
#
# 🔴 `mod_buffer` (`SetInputFilter BUFFER`) NÃO resolve — testado com escopo
# largo de propósito, para não confundir "não funciona" com "não foi aplicado".
# Não adianta reintroduzi-lo.
#
# ── POR QUE `SetEnvIf`, E NÃO `<LocationMatch>` ─────────────────────────────
#
# ⚠️ `<LocationMatch "^/filelist/">` NÃO funciona aqui, e falha do jeito pior:
# em silêncio. O `.htaccess` da raiz reescreve `/filelist/…` para
# `handlers/router.php`, e o location walk roda de novo contra a URI REESCRITA —
# a diretiva nunca é aplicada. Sintoma: config no ar, `configtest` OK, e zero
# efeito. A primeira tentativa de correção caiu exatamente nisso.
#
# `SetEnvIf` roda na fase de leitura de cabeçalhos, ANTES da reescrita, então
# enxerga a URI original. A segunda linha existe porque o mod_rewrite prefixa
# `REDIRECT_` nas variáveis ao redirecionar internamente — ela recupera a marca
# do outro lado.
#
# ── POR QUE O ESCOPO É ESTREITO ─────────────────────────────────────────────
#
# `<Directory /var/www/jimi_webhook>` também funciona (foi assim que a correção
# foi provada primeiro), mas aplicaria o spool a TODA rota — inclusive aos
# webhooks de GPS, que são os pedidos mais frequentes do sistema. Só o
# `/filelist` recebe corpo chunked; os webhooks do IoT Hub mandam
# `Content-Length` e nunca tiveram o problema.
# ============================================================================

SetEnvIf Request_URI "^/filelist/" proxy-sendcl=1
SetEnvIf REDIRECT_proxy-sendcl "^1$" proxy-sendcl=1
